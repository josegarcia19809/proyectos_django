<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crear un artículo</title>
</head>
<body>
<h1>Crear un artículo</h1>
{% if formulario.errors %}
    <div class="errores">
        <h3>
            Hay errores en el formulario
        </h3>
    </div>
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ formulario.as_p }}

    <button type="submit">Guardar</button>
</form>

</body>
</html>
