{% extends 'reservaciones/layouts/base.html' %}

{% block content %}

    <div class="container">

        <!-- 🧾 Título -->
        <div class="mb-4">
            <h2 class="text-center">👥 Clientes frecuentes</h2>
        </div>

        <!-- 📊 Card -->
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <strong>Ranking de clientes</strong>
            </div>

            <div class="card-body">

                <table class="table table-striped table-hover text-center">
                    <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Cliente</th>
                        <th>Reservaciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    {% for fila in data %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ fila.cliente__nombre }}</td>
                            <td>
                            <span class="badge bg-success">
                                {{ fila.total }}
                            </span>
                            </td>
                        </tr>
                    {% empty %}
                        <tr>
                            <td colspan="3">Sin datos</td>
                        </tr>
                    {% endfor %}
                    </tbody>

                </table>

            </div>
        </div>

    </div>

{% endblock %}
