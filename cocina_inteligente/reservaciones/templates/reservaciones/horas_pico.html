{% extends 'reservaciones/layouts/base.html' %}

{% block content %}
<h2>🔥 Horas pico</h2>

<table border="1">
    <tr>
        <th>Hora</th>
        <th>Total</th>
    </tr>

    {% for fila in data %}
    <tr>
        <td>{{ fila.hora_inicio }}</td>
        <td>{{ fila.total }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
