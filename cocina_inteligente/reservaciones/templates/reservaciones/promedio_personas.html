{% extends 'reservaciones/layouts/base.html' %}

{% block content %}

    <div class="container">

        <!-- 🧾 Título -->
        <div class="mb-4 text-center">
            <h2>👨‍👩‍👧 Promedio de personas por reservación</h2>
        </div>

        <!-- 📊 Card KPI -->
        <div class="row justify-content-center">
            <div class="col-md-4">

                <div class="card shadow text-center">
                    <div class="card-header bg-primary text-white">
                        <strong>Promedio de personas</strong>
                    </div>

                    <div class="card-body">
                        <h1 class="display-3 text-primary">
                            {{ data.promedio|floatformat:2 }}
                        </h1>
                        <p class="text-muted">Personas por reservación</p>
                    </div>

                </div>

            </div>
        </div>

    </div>

{% endblock %}
