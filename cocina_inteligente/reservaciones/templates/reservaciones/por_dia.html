{% extends 'reservaciones/layouts/base.html' %}

{% block content %}

    <div class="container">

        <!-- 🧾 Título -->
        <div class="mb-4 text-center">
            <h2>📅 Reservaciones por día</h2>
        </div>

        <!-- 📊 Card -->
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <strong>Actividad diaria</strong>
            </div>

            <div class="card-body">

                <table class="table table-striped table-hover text-center">
                    <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Fecha</th>
                        <th>Total</th>
                    </tr>
                    </thead>

                    <tbody>
                    {% for fila in data %}
                        <tr>
                            <td>{{ forloop.counter }}</td>

                            <!-- 📅 Fecha -->
                            <td>
                                {{ fila.fecha|date:"d/m/Y" }}
                            </td>

                            <!-- 🔢 Total -->
                            <td>
                            <span class="badge bg-success">
                                {{ fila.total }}
                            </span>
                            </td>
                        </tr>
                    {% empty %}
                        <tr>
                            <td colspan="3">Sin datos disponibles</td>
                        </tr>
                    {% endfor %}
                    </tbody>

                </table>

            </div>
        </div>

    </div>

{% endblock %}
