<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Listado de artículos</title>
</head>
<body>
<h1>Listado de artículos</h1>
<ul>
    {% for articulo in articulos %}
    <li>
        <h4>{{ articulo.id }}. {{articulo.title}} </h4>
        <p>{{articulo.content}}</p>
        <a href="{% url 'borrar_articulo' articulo.id %}">Eliminar</a>
    </li>
    {% endfor %}
</ul>
</body>
</html>
