<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}tinta_digital{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #111;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            padding: 20px;
        }

        footer {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .titulo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .fecha {
            display: block;
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
            font-style: italic;
        }

        .contenido {
            font-size: 18px;
            line-height: 1.6;
            color: #333;
        }

        .contenido p {
            margin-bottom: 15px;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
        }

        .dropdown-content a {
            display: block;
            padding: 8px;
            text-decoration: none;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>
<body>

<header>
    <h1>tinta_digital ✒️</h1>
    <p>Un espacio para ideas...</p>
</header>

<nav>
    <a href="{% url 'index' %}">Inicio</a>

    <div class="dropdown">
        <a href="{% url 'list_articles' %}" class="dropbtn">Categorías</a>

        <div class="dropdown-content">
            {% for categoria in categories %}
                <a href="{% url 'categoria' categoria.id %}">
                    {{ categoria.name }}
                </a>
            {% endfor %}
        </div>
    </div>

    {% for page in pages %}
        <a href="{% url 'page' page.2 %}">{{ page.1 }}</a>
    {% endfor %}

    <a href="{% url 'about' %}">Acerca</a>
</nav>

<div class="container">
    {% block content %}
        <!-- Contenido dinámico -->
    {% endblock %}
</div>

<footer>
    <p>© 2026 tinta_digital</p>
</footer>

</body>
</html>
