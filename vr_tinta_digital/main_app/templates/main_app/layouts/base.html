<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}tinta_digital{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #111;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            padding: 20px;
        }

        footer {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<header>
    <h1>tinta_digital ✒️</h1>
    <p>Un espacio para ideas...</p>
</header>

<nav>
    <a href="{% url 'index' %}">Inicio</a>
    <a href="#">Blog</a>
    <a href="{% url 'about' %}">Acerca</a>
</nav>

<div class="container">
    {% block content %}
        <!-- Contenido dinámico -->
    {% endblock %}
</div>

<footer>
    <p>© 2026 tinta_digital</p>
</footer>

</body>
</html>
