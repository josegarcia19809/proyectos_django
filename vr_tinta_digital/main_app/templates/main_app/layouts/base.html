<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}tinta_digital{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
            color: #ddd; /* antes #333 */
        }

        header {
            background-color: #111;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            margin: 0 10px;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            padding: 20px;
            flex: 1;
        }

        footer {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 10px;
            bottom: 0;
            width: 100%;
        }

        .titulo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .fecha {
            display: block;
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
            font-style: italic;
        }

        .contenido {
            font-size: 18px;
            line-height: 1.6;
            color: #333;
        }

        .contenido p {
            margin-bottom: 15px;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 150px;
        }

        .dropdown-content a {
            color: black;
            display: block;
            padding: 8px;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        nav a {
            color: #ddd;
            margin: 0 10px;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.25s ease;
        }

        nav a:hover {
            background-color: #555; /* gris oscuro */
            color: #fff;
            transform: translateY(-1px);
        }

        .imagen {
            width: 150px; /* tamaño más pequeño */
            height: 150px;
            object-fit: cover;
            border-radius: 50%; /* circular */
            float: left; /* 👈 clave */
            margin-right: 15px; /* espacio con el texto */
            margin-bottom: 10px;
        }

        .card {
            overflow: auto;
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .pagination {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
        }

        .pagination a {
            display: inline-block;
            padding: 8px 14px;
            margin: 4px;
            border-radius: 20px; /* más suave */
            background-color: #333; /* igual que nav */
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .pagination a:hover {
            background-color: #00bcd4; /* tu color principal */
            box-shadow: 0 0 8px #00bcd4;
            transform: translateY(-2px);
        }

        .pagination .current {
            display: inline-block;
            margin: 0 10px;
            color: #555;
            font-weight: bold;
        }

        /* Contenedor */
        .form-container {
            max-width: 400px;
            margin: 30px auto;
            padding: 20px;
            background-color: #222;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        /* Título */
        .form-title {
            text-align: center;
            color: #333;
        }

        /* Grupo de campos */
        .form-group {
            margin-bottom: 15px;
        }

        /* Labels */
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }

        /* Inputs */
        .form-group input {
            width: 90%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background-color: #333;
            color: #fff;
        }

        /* Focus */
        .form-group input:focus {
            outline: none;
            border-color: #777;
        }

        /* Botón */
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background-color: #666;
        }

        /* Contenedor */
        .messages {
            max-width: 600px;
            margin: 20px auto;
        }

        /* Base */
        .alert {
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 14px;
            color: #ddd;
            background-color: #333;
            border-left: 5px solid #555;
        }

        /* Tipos de mensajes */
        .alert.success {
            border-left-color: #4caf50;
        }

        .alert.error {
            border-left-color: #f44336;
        }

        .alert.warning {
            border-left-color: #ff9800;
        }

        .alert.info {
            border-left-color: #2196f3;
        }

        /* Hover suave */
        .alert:hover {
            background-color: #3a3a3a;
        }
    </style>
</head>
<body>

<header>
    <h1>tinta_digital ✒️</h1>
    <p>Un espacio para ideas...</p>
</header>

<nav>
    <a href="{% url 'index' %}">Inicio</a>

    <div class="dropdown">
        <a href="{% url 'list_articles' %}" class="dropbtn">Categorías</a>

        <div class="dropdown-content">
            {% for category in categories %}
                <a href="{% url 'category' category.0 %}">
                    {{ category.1 }}
                </a>
            {% endfor %}
        </div>

    </div>

    {% for page in pages %}
        <a href="{% url 'page' page.2 %}">{{ page.1 }}</a>
    {% endfor %}

    <a href="{% url 'about' %}">Acerca</a>
    <a href="{% url 'register' %}">Registro</a>
    <a href="{% url 'login' %}">Login</a>
</nav>

<div class="container">
    {% block content %}
        <!-- Contenido dinámico -->
    {% endblock %}
</div>

<footer>
    <p>© 2026 tinta_digital</p>
</footer>

</body>
</html>
