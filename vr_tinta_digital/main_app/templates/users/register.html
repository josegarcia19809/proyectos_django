{% extends 'main_app/layouts/base.html' %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}
    <h2>{{ title }}</h2>

    {{ register_form.errors }}
    <form method="POST" action="">
        {% csrf_token %}

        {% for field in register_form %}
            {{ field.label }}
            {{ field }}
        {% endfor %}

        <input type="submit" value="Registrarse">
    </form>
{% endblock %}
