{% extends 'main_app/layouts/base.html' %}

{% block title %}
    {{ article.title }}
{% endblock %}

{% block content %}
    {% if article.image %}
            <img src="{{ article.image.url }}" class="imagen"/>
        {% endif %}
    <h2 class="titulo">{{ article.title }}</h2>

    <span class="fecha">
    {{ article.created_at|date:"d M Y - H:i" }}
    </span>

    <div class="contenido">
        <p>{{ article.content|safe }}</p>
    </div>
{% endblock %}
