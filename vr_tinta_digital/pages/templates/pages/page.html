{% extends 'main_app/layouts/base.html' %}

{% block title %}
    {{ page.title }}
{% endblock %}

{% block content %}
    <h2 class="titulo">{{ page.title }}</h2>

    <span class="fecha">
    {{ page.created_at|date:"d M Y - H:i" }}
    </span>

    <div class="contenido">
        <p>{{ page.content|safe }}</p>
    </div>
{% endblock %}
